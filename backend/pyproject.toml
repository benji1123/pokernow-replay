[project]
name = "pokernow-analyzer"
version = "0.1.0"
description = "Parse PokerNow session logs into hands and per-player stats (pure stdlib; runs in the browser via Pyodide)"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pokernow_analyzer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
